name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ya-obs-cli-v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: ${{ matrix.target }}

      - name: Install cross-compile toolchain (aarch64 linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        working-directory: rust
        run: cargo build --locked --release --target ${{ matrix.target }} -p ya-obs-cli

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        working-directory: rust/target/${{ matrix.target }}/release
        run: |
          tar -czf ya-obs-${{ matrix.target }}.tar.gz ya-obs
          shasum -a 256 ya-obs-${{ matrix.target }}.tar.gz > ya-obs-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: matrix.archive == 'zip'
        working-directory: rust/target/${{ matrix.target }}/release
        shell: pwsh
        run: |
          Compress-Archive -Path ya-obs.exe -DestinationPath ya-obs-${{ matrix.target }}.zip
          $archive = "ya-obs-${{ matrix.target }}.zip"
          "$((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower())  $archive" | Out-File "$archive.sha256" -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: ya-obs-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/ya-obs-${{ matrix.target }}.tar.gz
            rust/target/${{ matrix.target }}/release/ya-obs-${{ matrix.target }}.tar.gz.sha256
            rust/target/${{ matrix.target }}/release/ya-obs-${{ matrix.target }}.zip
            rust/target/${{ matrix.target }}/release/ya-obs-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: publish release
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts and smoke-test Linux binary
        env:
          TAG: ${{ inputs.tag }}
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 10
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            case "$target" in *windows*) ext=zip ;; *) ext=tar.gz ;; esac
            test -s "ya-obs-$target.$ext"
            sha256sum --check "ya-obs-$target.$ext.sha256"
          done
          tar -xzf ya-obs-x86_64-unknown-linux-gnu.tar.gz
          test "$(./ya-obs --version)" = "ya-obs ${TAG#ya-obs-cli-v}"
          ./ya-obs cp --help
          rm ya-obs

      - name: Create or complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          KEEP_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          git show-ref --verify "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          VERSION="${TAG#ya-obs-cli-v}"
          export VERSION
          python3 - <<'PYNOTES'
          import os, pathlib
          version = os.environ['VERSION']
          text = pathlib.Path('rust/CHANGELOG.md').read_text()
          marker = f'## [{version}] - '
          if marker not in text:
              raise SystemExit('Missing versioned release notes')
          notes = text.split(marker, 1)[1].split('\n', 1)[1].split('\n## [', 1)[0].strip()
          if not notes:
              raise SystemExit('Empty release notes')
          pathlib.Path('release-notes.md').write_text(notes + '\n')
          PYNOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 10
          if [ "$KEEP_DRAFT" = false ]; then
            ACCEPTED=$(gh run list --workflow publishing-acceptance.yml --commit "$(git rev-parse HEAD)" --status success --limit 1 --json databaseId --jq 'length')
            test "$ACCEPTED" -eq 1
            gh release edit "$TAG" --draft=false --latest
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
